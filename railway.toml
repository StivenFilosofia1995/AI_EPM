# Configuración de Railway
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
# NO se declara buildContext: el builder de Railway no lo aplica, y confiar en
# él producía builds donde requirements.txt y static/ "no existían". El
# contexto queda en la raíz del repositorio y el Dockerfile usa rutas con
# prefijo backend/.

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
