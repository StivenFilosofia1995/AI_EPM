# Entorno local. Ya no levanta Ollama: el proyecto solo usa Anthropic, y
# únicamente en la etapa de análisis e ideas. La captura de datos funciona
# sin ningún modelo.
#
# Requiere backend/.env con las credenciales reales. Ese archivo está en
# .gitignore: nunca escribas valores reales en .env.example.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Sobrescribe lo que haga falta para desarrollo local.
      - CORS_ORIGINS=http://localhost:8000
      - PORT=8000
    volumes:
      # Solo lectura: el contenedor no debe modificar el código fuente.
      - ./backend/app:/app/app:ro
      - ./backend/static:/app/static:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)\""]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
