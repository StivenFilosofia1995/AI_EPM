[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501: la longitud la controla el formateo manual.
# B008: Depends() en la firma es el idioma de FastAPI.
# UP042: InputType hereda de str a proposito, para serializar
#        como texto plano en JSON y coincidir con el YAML.
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
