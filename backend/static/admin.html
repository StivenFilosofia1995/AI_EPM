<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel de administración — Fundación EPM</title>
  <link rel="icon" href="/static/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/tree.css" />
  <style>
    .admin-shell { max-width: 1280px; margin: 0 auto; padding: 26px 22px; }
    .admin-cab {
      display: flex; align-items: center; gap: 14px;
      padding-bottom: 18px; margin-bottom: 22px; border-bottom: 1px solid var(--border);
    }
    .admin-cab h1 { font-size: 19px; font-weight: 700; flex: 1; }
    .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .tarjeta {
      background: var(--glass); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 15px;
    }
    .tarjeta .cifra { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .tarjeta .rotulo { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .6px; margin-top: 3px; }
    .pestanas { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
    .pestana {
      padding: 8px 15px; border-radius: var(--radius-sm); cursor: pointer;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-dim); font-size: 13px; font-weight: 600; font-family: var(--font);
    }
    .pestana.activa { background: var(--green-dim); border-color: var(--green); color: #4ade80; }
    .filtros { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 18px; align-items: flex-end; }
    .filtros .campo { margin-bottom: 0; min-width: 145px; }
    .tabla-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
    .tabla-resumen tbody tr:hover { background: var(--glass); }
    .clickable { cursor: pointer; }
    .modal-fondo {
      position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 300;
      display: flex; align-items: flex-start; justify-content: center; padding: 34px 18px; overflow-y: auto;
    }
    .modal {
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 26px; max-width: 940px; width: 100%;
    }
    .hist { margin-top: 7px; padding-left: 13px; border-left: 2px solid var(--blue-dim); font-size: 12px; color: var(--text-dim); }
    .marca-origen { font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: 6px; }
    .origen-sugerencia_ia { background: var(--blue-dim); color: #7dd3fc; }
    .origen-sugerencia_editada { background: rgba(251,191,36,.18); color: #fcd34d; }
  </style>
</head>
<body>

<div class="acceso" id="pantallaAcceso">
  <div class="acceso-card">
    <div class="acceso-logo">epm</div>
    <h1>Panel de administración</h1>
    <p class="sub">Requiere rol de administrador o coordinador.</p>
    <form id="formAcceso" novalidate>
      <div class="campo">
        <label for="email">Correo institucional</label>
        <input type="email" id="email" autocomplete="username" required autofocus />
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primario btn-bloque">Ingresar</button>
    </form>
    <div class="error-caja oculto" id="errorAcceso" role="alert" aria-live="assertive"></div>
  </div>
</div>

<div class="admin-shell oculto" id="app">
  <header class="admin-cab">
    <div class="marca-logo">epm</div>
    <h1>Panel de administración</h1>
    <span id="usuarioInfo" style="font-size:13px;color:var(--text-dim)"></span>
    <button class="btn" id="btnSalir">Salir</button>
  </header>

  <div class="tarjetas" id="tarjetas"></div>

  <nav class="pestanas" role="tablist">
    <button class="pestana activa" data-vista="sesiones" role="tab">Sesiones</button>
    <button class="pestana" data-vista="usuarios" role="tab">Avance por facilitador</button>
    <button class="pestana" data-vista="campos" role="tab">Campos problemáticos</button>
    <button class="pestana" data-vista="sugerencias" role="tab">Uso de sugerencias</button>
    <button class="pestana" data-vista="cuentas" role="tab">Cuentas</button>
  </nav>

  <div id="avisos" aria-live="polite"></div>
  <div id="contenido"></div>
</div>

<script>
'use strict';
const TOKEN_KEY = 'epm_token';
let TOKEN = localStorage.getItem(TOKEN_KEY) || '';
let USUARIO = null;
let VISTA = 'sesiones';

const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...hijos) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  for (const h of hijos) { if (h != null) n.appendChild(typeof h === 'string' ? document.createTextNode(h) : h); }
  return n;
};

function aviso(texto, tipo = 'error') {
  $('#avisos').innerHTML = '';
  $('#avisos').appendChild(el('div', { class: `aviso aviso-${tipo}`, text: texto }));
}

async function api(ruta, opciones = {}) {
  const cfg = { method: opciones.method || 'GET', headers: { 'Content-Type': 'application/json' } };
  if (TOKEN) cfg.headers['Authorization'] = `Bearer ${TOKEN}`;
  if (opciones.body !== undefined) cfg.body = JSON.stringify(opciones.body);
  const r = await fetch(ruta, cfg);
  if (r.status === 401) { salir(); throw new Error('La sesión expiró.'); }
  let d = null; try { d = await r.json(); } catch {}
  if (!r.ok) throw new Error((d && typeof d.detail === 'string' ? d.detail : `Error ${r.status}.`));
  return d;
}

function fecha(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString('es-CO', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
  catch { return iso; }
}

// ── Acceso ──────────────────────────────────────────────────────────────
$('#formAcceso').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('#errorAcceso');
  err.classList.add('oculto');
  try {
    const d = await api('/api/auth/login', { method: 'POST', body: { email: $('#email').value.trim(), password: $('#password').value } });
    if (!['admin', 'coordinador'].includes(d.user.rol)) {
      err.textContent = 'Esta cuenta no tiene permisos de administración.';
      err.classList.remove('oculto');
      return;
    }
    TOKEN = d.access_token;
    localStorage.setItem(TOKEN_KEY, TOKEN);
    USUARIO = d.user;
    await iniciar();
  } catch (ex) {
    err.textContent = ex.message;
    err.classList.remove('oculto');
  }
});

function salir() {
  localStorage.removeItem(TOKEN_KEY);
  TOKEN = ''; USUARIO = null;
  $('#app').classList.add('oculto');
  $('#pantallaAcceso').classList.remove('oculto');
}
$('#btnSalir').addEventListener('click', salir);

// ── Inicio ──────────────────────────────────────────────────────────────
async function iniciar() {
  if (!USUARIO) USUARIO = await api('/api/auth/me');
  if (!['admin', 'coordinador'].includes(USUARIO.rol)) { salir(); return; }

  $('#usuarioInfo').textContent = `${USUARIO.nombre} · ${USUARIO.rol}`;
  $('#pantallaAcceso').classList.add('oculto');
  $('#app').classList.remove('oculto');

  document.querySelectorAll('.pestana').forEach(p => {
    p.addEventListener('click', () => {
      document.querySelectorAll('.pestana').forEach(x => x.classList.remove('activa'));
      p.classList.add('activa');
      VISTA = p.dataset.vista;
      pintar();
    });
  });

  try {
    const r = await api('/api/admin/resumen');
    const t = $('#tarjetas'); t.innerHTML = '';
    const cifras = [
      ['Sesiones totales', r.total_sesiones],
      ['Completadas', r.por_estado.completada || 0],
      ['En progreso', r.por_estado.en_progreso || 0],
      ['Planeadas', r.por_estado.planeada || 0],
      ['Facilitadores activos', r.usuarios_activos],
      ['Versión del árbol', r.tree_version],
    ];
    for (const [rotulo, cifra] of cifras) {
      t.appendChild(el('div', { class: 'tarjeta' },
        el('div', { class: 'cifra', text: String(cifra) }),
        el('div', { class: 'rotulo', text: rotulo })));
    }
  } catch (ex) { aviso(ex.message); }

  pintar();
}

async function pintar() {
  const c = $('#contenido');
  c.innerHTML = '<div class="cargando">Cargando…</div>';
  $('#avisos').innerHTML = '';
  try {
    if (VISTA === 'sesiones')         await vistaSesiones(c);
    else if (VISTA === 'usuarios')    await vistaTablaSimple(c, '/api/admin/avance-usuarios', 'usuarios');
    else if (VISTA === 'campos')      await vistaTablaSimple(c, '/api/admin/campos-problematicos', 'campos');
    else if (VISTA === 'sugerencias') await vistaTablaSimple(c, '/api/admin/uso-sugerencias', 'campos');
    else if (VISTA === 'cuentas')     await vistaCuentas(c);
  } catch (ex) { c.innerHTML = ''; aviso(ex.message); }
}

// ── Sesiones ────────────────────────────────────────────────────────────
async function vistaSesiones(c) {
  c.innerHTML = '';
  const filtros = el('div', { class: 'filtros' });
  const mk = (id, etiqueta, opciones) => {
    const sel = el('select', { id });
    sel.appendChild(el('option', { value: '' }, 'Todos'));
    for (const o of opciones) sel.appendChild(el('option', { value: o }, o));
    filtros.appendChild(el('div', { class: 'campo' }, el('label', { for: id, text: etiqueta }), sel));
  };
  mk('fEstado', 'Estado', ['en_progreso', 'planeada', 'completada', 'abandonada']);
  mk('fPrograma', 'Programa', ['Biblioteca_EPM', 'Programa_UVA', 'Museo_del_Agua', 'Parque_de_los_deseos']);

  const fDesde = el('input', { type: 'date', id: 'fDesde' });
  filtros.appendChild(el('div', { class: 'campo' }, el('label', { for: 'fDesde', text: 'Desde' }), fDesde));
  const fHasta = el('input', { type: 'date', id: 'fHasta' });
  filtros.appendChild(el('div', { class: 'campo' }, el('label', { for: 'fHasta', text: 'Hasta' }), fHasta));
  const fAvance = el('input', { type: 'number', id: 'fAvance', min: 0, max: 100, placeholder: '0' });
  filtros.appendChild(el('div', { class: 'campo' }, el('label', { for: 'fAvance', text: 'Avance mínimo %' }), fAvance));
  filtros.appendChild(el('button', { class: 'btn btn-primario', onclick: cargar, text: 'Filtrar' }));
  c.appendChild(filtros);

  const zona = el('div');
  c.appendChild(zona);

  async function cargar() {
    zona.innerHTML = '<div class="cargando">Consultando…</div>';
    const p = new URLSearchParams();
    for (const [id, clave] of [['fEstado','estado'],['fPrograma','programa'],['fDesde','desde'],['fHasta','hasta'],['fAvance','avance_minimo']]) {
      const v = $('#' + id).value;
      if (v) p.set(clave, v);
    }
    try {
      const d = await api('/api/admin/sesiones?' + p.toString());
      zona.innerHTML = '';
      zona.appendChild(el('p', { class: 'nodo-ayuda', text: `${d.total} sesiones` }));
      const tabla = el('table', { class: 'tabla-resumen' });
      tabla.appendChild(el('thead', {}, el('tr', {},
        ...['Facilitador','ID actividad','Nombre','Programa','Estado','Avance','Creada','']
          .map(h => el('th', { text: h })))));
      const tb = el('tbody');
      for (const s of d.sesiones) {
        tb.appendChild(el('tr', {},
          el('td', { text: s.facilitador || '—' }),
          el('td', { text: s.id_actividad || '—' }),
          el('td', { text: s.nombre || '—' }),
          el('td', { text: s.programa || '—' }),
          el('td', {}, el('span', { class: 'etiqueta-bloque', text: s.estado || '—' })),
          el('td', { text: (s.porcentaje_avance ?? 0) + '%' }),
          el('td', { text: fecha(s.created_at) }),
          el('td', {}, el('button', { class: 'btn', onclick: () => detalle(s.session_id), text: 'Ver' })),
        ));
      }
      tabla.appendChild(tb);
      zona.appendChild(el('div', { class: 'tabla-wrap' }, tabla));
    } catch (ex) { zona.innerHTML = ''; aviso(ex.message); }
  }
  await cargar();
}

async function detalle(sessionId) {
  const fondo = el('div', { class: 'modal-fondo', onclick: (e) => { if (e.target === fondo) fondo.remove(); } });
  const modal = el('div', { class: 'modal' }, el('div', { class: 'cargando', text: 'Cargando detalle…' }));
  fondo.appendChild(modal);
  document.body.appendChild(fondo);

  try {
    const d = await api(`/api/admin/sesion/${sessionId}`);
    modal.innerHTML = '';
    modal.appendChild(el('h2', { class: 'nodo-pregunta', text: d.sesion.nombre || 'Consolidación' }));
    modal.appendChild(el('p', { class: 'nodo-ayuda',
      text: `${d.sesion.facilitador || 'Sin facilitador'} · ${d.sesion.estado} · ${d.sesion.porcentaje_avance ?? 0}% · árbol ${d.sesion.tree_version || '—'}` }));

    const tabla = el('table', { class: 'tabla-resumen' });
    tabla.appendChild(el('thead', {}, el('tr', {},
      ...['Campo','Valor','Respondida','Intentos','Historial'].map(h => el('th', { text: h })))));
    const tb = el('tbody');

    for (const r of d.respuestas) {
      const celdaValor = el('td', { class: 'campo-valor' }, el('span', { text: r.valor || '—' }));
      if (r.origen && r.origen !== 'propio') {
        celdaValor.appendChild(el('span', { class: `marca-origen origen-${r.origen}`,
          text: r.origen === 'sugerencia_ia' ? 'sugerencia' : 'sugerencia editada' }));
      }
      const celdaHist = el('td');
      if (r.correcciones && r.correcciones.length) {
        celdaHist.appendChild(el('b', { text: `${r.correcciones.length} corrección(es)` }));
        for (const h of r.correcciones) {
          celdaHist.appendChild(el('div', { class: 'hist', text: `v${h.version_num}: ${h.valor || '(vacío)'}` }));
        }
      } else { celdaHist.textContent = '—'; }

      tb.appendChild(el('tr', { class: r.stale ? 'no-alcanzable' : '' },
        el('td', { text: r.header || r.node_id }),
        celdaValor,
        el('td', { text: fecha(r.answered_at) }),
        el('td', { text: String(r.intentos ?? 1) }),
        celdaHist));
    }
    tabla.appendChild(tb);
    modal.appendChild(el('div', { class: 'tabla-wrap' }, tabla));

    if (d.analisis && d.analisis.length) {
      modal.appendChild(el('h3', { style: 'margin:20px 0 10px;font-size:15px', text: 'Análisis generado' }));
      for (const a of d.analisis) {
        modal.appendChild(el('div', { class: 'pieza-analisis' },
          el('h3', { text: `${a.tipo} · ${fecha(a.generado_at)} · ${a.modelo}` }),
          el('div', { class: 'cuerpo', text: a.contenido })));
      }
    }

    modal.appendChild(el('div', { class: 'acciones' },
      el('button', { class: 'btn btn-primario', onclick: () => descargar(sessionId), text: 'Descargar Excel' }),
      el('div', { class: 'espaciador' }),
      el('button', { class: 'btn', onclick: () => fondo.remove(), text: 'Cerrar' })));
  } catch (ex) {
    modal.innerHTML = '';
    modal.appendChild(el('div', { class: 'aviso aviso-error', text: ex.message }));
    modal.appendChild(el('button', { class: 'btn', onclick: () => fondo.remove(), text: 'Cerrar' }));
  }
}

async function descargar(sessionId) {
  try {
    const r = await fetch('/api/excel/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${TOKEN}` },
      body: JSON.stringify({ session_id: sessionId }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const url = URL.createObjectURL(await r.blob());
    const a = el('a', { href: url, download: `consolidacion_${sessionId.slice(0, 8)}.xlsx` });
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  } catch (ex) { aviso('No se pudo generar el Excel: ' + ex.message); }
}

// ── Tablas genéricas ────────────────────────────────────────────────────
async function vistaTablaSimple(c, ruta, clave) {
  const d = await api(ruta);
  const filas = d[clave] || [];
  c.innerHTML = '';
  if (!filas.length) {
    c.appendChild(el('p', { class: 'nodo-ayuda', text: 'Todavía no hay datos suficientes.' }));
    return;
  }
  const columnas = Object.keys(filas[0]);
  const tabla = el('table', { class: 'tabla-resumen' });
  tabla.appendChild(el('thead', {}, el('tr', {},
    ...columnas.map(k => el('th', { text: k.replace(/_/g, ' ') })))));
  const tb = el('tbody');
  for (const f of filas) {
    tb.appendChild(el('tr', {}, ...columnas.map(k =>
      el('td', { text: f[k] === null || f[k] === undefined ? '—' : String(f[k]) }))));
  }
  tabla.appendChild(tb);
  c.appendChild(el('div', { class: 'tabla-wrap' }, tabla));
}

// ── Cuentas ─────────────────────────────────────────────────────────────
async function vistaCuentas(c) {
  const d = await api('/api/auth/usuarios');
  c.innerHTML = '';

  if (USUARIO.rol === 'admin') {
    const form = el('form', { class: 'filtros', onsubmit: crear });
    const campos = [
      ['nuevoNombre', 'Nombre completo', 'text'],
      ['nuevoEmail', 'Correo', 'email'],
      ['nuevoPass', 'Contraseña temporal', 'text'],
    ];
    for (const [id, etiqueta, tipo] of campos) {
      form.appendChild(el('div', { class: 'campo' },
        el('label', { for: id, text: etiqueta }),
        el('input', { type: tipo, id, required: true })));
    }
    const selRol = el('select', { id: 'nuevoRol' });
    for (const r of ['facilitador', 'coordinador', 'admin']) selRol.appendChild(el('option', { value: r }, r));
    form.appendChild(el('div', { class: 'campo' }, el('label', { for: 'nuevoRol', text: 'Rol' }), selRol));
    const selProg = el('select', { id: 'nuevoPrograma' });
    selProg.appendChild(el('option', { value: '' }, 'Sin programa'));
    for (const p of ['Biblioteca_EPM','Programa_UVA','Museo_del_Agua','Parque_de_los_deseos']) selProg.appendChild(el('option', { value: p }, p));
    form.appendChild(el('div', { class: 'campo' }, el('label', { for: 'nuevoPrograma', text: 'Programa' }), selProg));
    form.appendChild(el('button', { class: 'btn btn-primario', type: 'submit', text: 'Crear cuenta' }));
    c.appendChild(form);
    c.appendChild(el('p', { class: 'nodo-ayuda',
      text: 'La persona deberá cambiar la contraseña temporal en su primer ingreso. Comunícasela por un canal seguro, nunca por correo sin cifrar.' }));
  }

  const tabla = el('table', { class: 'tabla-resumen' });
  tabla.appendChild(el('thead', {}, el('tr', {},
    ...['Nombre','Correo','Rol','Programa','Activa','Último acceso',''].map(h => el('th', { text: h })))));
  const tb = el('tbody');
  for (const u of d.usuarios) {
    tb.appendChild(el('tr', {},
      el('td', { text: u.nombre }),
      el('td', { text: u.email }),
      el('td', {}, el('span', { class: 'etiqueta-bloque', text: u.rol })),
      el('td', { text: u.programa || '—' }),
      el('td', { text: u.activo ? 'Sí' : 'No' }),
      el('td', { text: fecha(u.ultimo_acceso) }),
      el('td', {}, USUARIO.rol === 'admin' && u.id !== USUARIO.id
        ? el('button', { class: 'btn', onclick: () => alternar(u), text: u.activo ? 'Desactivar' : 'Activar' })
        : el('span', { text: '—' })),
    ));
  }
  tabla.appendChild(tb);
  c.appendChild(el('div', { class: 'tabla-wrap' }, tabla));

  async function crear(e) {
    e.preventDefault();
    try {
      await api('/api/auth/usuarios', { method: 'POST', body: {
        nombre: $('#nuevoNombre').value.trim(),
        email: $('#nuevoEmail').value.trim(),
        password_temporal: $('#nuevoPass').value,
        rol: $('#nuevoRol').value,
        programa: $('#nuevoPrograma').value || null,
      }});
      aviso('Cuenta creada.', 'ok');
      pintar();
    } catch (ex) { aviso(ex.message); }
  }

  async function alternar(u) {
    try {
      await api(`/api/auth/usuarios/${u.id}/activo`, { method: 'PATCH', body: { activo: !u.activo } });
      pintar();
    } catch (ex) { aviso(ex.message); }
  }
}

// ── Arranque ────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  if (!TOKEN) { $('#pantallaAcceso').classList.remove('oculto'); return; }
  try { await iniciar(); } catch { salir(); }
});
</script>
</body>
</html>
