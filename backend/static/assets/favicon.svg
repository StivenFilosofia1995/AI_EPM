<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="16" fill="#0d0d0d"/>
  <!-- Green arc in top-right, echoing Fundación Grupo EPM brand -->
  <circle cx="28" cy="4" r="14" fill="none"
    stroke="#4DB848" stroke-width="5"
    stroke-dasharray="12 40"
    stroke-dashoffset="0"
    transform="rotate(-30 28 4)"
    clip-path="url(#fc)"/>
  <clipPath id="fc"><circle cx="16" cy="16" r="16"/></clipPath>
  <!-- "epm" text centred -->
  <text x="5" y="21"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="11"
    letter-spacing="-0.3"
    fill="#4DB848"
  >epm</text>
</svg>
