<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consolidación Metodológica — Fundación EPM</title>
  <link rel="icon" href="/static/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/tree.css" />
</head>
<body>

<!-- ══ Acceso ══════════════════════════════════════════════════════════ -->
<div class="acceso" id="pantallaAcceso">
  <div class="acceso-card">
    <div class="acceso-logo">epm</div>
    <h1>Consolidación Metodológica</h1>
    <p class="sub">Ingresa con la cuenta que te asignó el administrador.</p>

    <form id="formAcceso" novalidate>
      <div class="campo">
        <label for="email">Correo institucional</label>
        <input type="email" id="email" name="email" autocomplete="username"
               required autofocus />
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primario btn-bloque" id="btnAcceder">
        Ingresar
      </button>
    </form>

    <div class="error-caja oculto" id="errorAcceso" role="alert" aria-live="assertive"></div>
  </div>
</div>

<!-- ══ Cambio de contraseña obligatorio ════════════════════════════════ -->
<div class="acceso oculto" id="pantallaCambio">
  <div class="acceso-card">
    <div class="acceso-logo">epm</div>
    <h1>Define tu contraseña</h1>
    <p class="sub">
      Tu cuenta usa una contraseña temporal. Debes cambiarla antes de continuar.
    </p>

    <form id="formCambio" novalidate>
      <div class="campo">
        <label for="passActual">Contraseña temporal</label>
        <input type="password" id="passActual" autocomplete="current-password" required />
      </div>
      <div class="campo">
        <label for="passNueva">Contraseña nueva</label>
        <input type="password" id="passNueva" autocomplete="new-password" required />
      </div>
      <div class="campo">
        <label for="passConfirma">Confirma la contraseña nueva</label>
        <input type="password" id="passConfirma" autocomplete="new-password" required />
      </div>
      <p class="sub" style="margin-bottom:16px">
        Mínimo 10 caracteres, con al menos una letra y un número.
      </p>
      <button type="submit" class="btn btn-primario btn-bloque">Guardar y continuar</button>
    </form>

    <div class="error-caja oculto" id="errorCambio" role="alert" aria-live="assertive"></div>
  </div>
</div>

<!-- ══ Aplicación ══════════════════════════════════════════════════════ -->
<div class="app-shell oculto" id="app">

  <aside class="panel-lateral">
    <div class="marca">
      <div class="marca-logo">epm</div>
      <span>Consolidación<br />Metodológica</span>
    </div>

    <div id="progresoBloques" aria-label="Progreso por bloque"></div>

    <div>
      <button class="btn btn-bloque" id="btnMisSesiones" style="margin-bottom:8px">
        Mis consolidaciones
      </button>
      <button class="btn btn-bloque" id="btnNueva">Nueva actividad</button>
    </div>

    <div class="usuario-caja">
      <b id="usuarioNombre"></b>
      <span id="usuarioEmail"></span>
      <div><span class="usuario-rol" id="usuarioRol"></span></div>
      <button class="btn btn-bloque" id="btnSalir" style="margin-top:12px">
        Cerrar sesión
      </button>
    </div>
  </aside>

  <main class="contenido">
    <div id="avisos" aria-live="polite"></div>

    <!-- Vista: nodo actual -->
    <section id="vistaNodo" aria-live="polite">
      <div class="cargando">Cargando…</div>
    </section>

    <!-- Vista: resumen de los 25 campos -->
    <section id="vistaResumen" class="oculto"></section>

    <!-- Vista: listado de sesiones -->
    <section id="vistaSesiones" class="oculto"></section>

    <!-- Vista: análisis final -->
    <section id="vistaAnalisis" class="oculto"></section>
  </main>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
