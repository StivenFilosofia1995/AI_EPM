name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests scripts

      - name: Mypy (modo permisivo)
        run: mypy app --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Pruebas
        run: pytest -q
        env:
          # El motor no necesita credenciales: las pruebas usan un cliente
          # de Supabase simulado y no llaman al modelo.
          SECRET_KEY: clave-solo-para-pruebas-no-usar-en-produccion
          CORS_ORIGINS: http://localhost:8000

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar que no se versionen credenciales
        run: |
          if git ls-files | grep -E '(service_account|credentials|client_secret).*\.json$'; then
            echo "::error::Hay un archivo de credenciales versionado."
            exit 1
          fi
          if git ls-files | grep -E '\.(pem|key|p12)$'; then
            echo "::error::Hay una clave privada versionada."
            exit 1
          fi
          if git ls-files | grep -E '\.pyc$'; then
            echo "::error::Hay archivos .pyc versionados."
            exit 1
          fi
          echo "Sin credenciales ni bytecode versionados."
